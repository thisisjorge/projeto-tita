name: Relato de Bug
description: Crie um relatório para nos ajudar a identificar e corrigir um problema no Projeto Titã.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar um problema no Projeto Titã! Por favor, forneça o máximo de informações possível para nos ajudar a reproduzir e solucionar o bug.
  - type: textarea
    id: description
    attributes:
      label: Descrição do Bug
      description: Uma descrição clara e concisa do que ocorreu de forma inesperada.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Passos detalhados para reproduzir o comportamento reportado.
      placeholder: |
        1. Vá para 'Treino Ativo'
        2. Clique em 'Concluir Série'
        3. Observe que...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que você esperava que acontecesse.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma Afetada
      options:
        - Web / PWA (Chrome/Edge/Brave)
        - Web / PWA (Firefox)
        - Web / PWA (Safari)
        - Android (Capacitor / APK)
        - iOS (Capacitor)
        - Backend / Sincronização Opcional
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do Projeto Titã
      placeholder: 'ex: 2.0.0'
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Confirmo que não incluí dados pessoais sensíveis, senhas ou tokens neste relatório.
          required: true
