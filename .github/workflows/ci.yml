name: CI — Release Quality Matrix

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Unit & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict typecheck
        run: npm run typecheck
      - name: Unit and property-based tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E and visual/a11y/perf tests
        run: npm run test:e2e
      - name: Repeat first-install and touch target regressions
        run: npx playwright test tests/e2e/accessibility.spec.ts tests/e2e/pwa-offline.spec.ts --grep 'Interactive navigation|first PWA installation' --repeat-each=10
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
